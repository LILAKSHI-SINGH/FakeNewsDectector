services:
  # FastAPI Machine Learning Backend Service
  - type: web
    name: fake-news-detector-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python ml/train.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
